# TAC-LAnoBERT — BGL (Ablation: Baseline - No TAC Features)
# Pure LAnoBERT for comparison

dataset: BGL
run_name: bgl_tac_baseline

paths:
  raw_log: data/BGL/BGL.log
  train_raw: data/BGL/BGL_train_normal.raw
  test_raw: data/BGL/BGL_test.raw
  test_label: data/BGL/BGL_test_label.log
  train_normal: data/BGL/BGL_train_normal_parsed.log
  test_log: data/BGL/BGL_test_parsed.log
  tokenizer_dir: outputs/BGL_tac_baseline/tokenizer
  model_dir: outputs/BGL_tac_baseline/model
  result_dir: outputs/BGL_tac_baseline/results

split:
  method: line
  train_ratio: 0.8
  label_marker: "-"

preprocess:
  regex_profile: bgl
  mask_block_id: true
  mask_ip: true
  mask_number: true
  drop_header_fields: 3

tokenizer:
  vocab_size: 1000
  min_frequency: 2
  lowercase: false

train:
  max_len: 512
  mlm_probability: 0.20
  num_train_epochs: 2
  per_device_train_batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  save_steps: 5000
  save_total_limit: 2
  logging_steps: 200
  seed: 42
  eval_ratio: 0.01
  bf16: true

inference:
  hf_model: null
  score: error_mean # Standard MLM scoring
  top_k: 5
  batch_size: 16

tac:
  enabled: false # ABLATION: No TAC features (pure baseline)
  mode: baseline

  time2vec:
    enabled: false

  memory:
    enabled: false

  scoring:
    alpha: 1.0 # Pure MLM
    threshold: static
    normalize_scores: true
