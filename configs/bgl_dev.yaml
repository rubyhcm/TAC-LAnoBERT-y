# LAnoBERT — BGL (development config - small subset)
# For quick iteration during development
dataset: BGL
run_name: bgl_dev

paths:
  raw_log: data/BGL/BGL.log
  train_raw: data/BGL/BGL_train_normal.raw
  test_raw: data/BGL/BGL_test.raw
  test_label: data/BGL/BGL_test_label.log
  train_normal: data/BGL/BGL_train_normal_parsed.log
  test_log: data/BGL/BGL_test_parsed.log
  tokenizer_dir: outputs/BGL_dev/tokenizer
  model_dir: outputs/BGL_dev/model
  result_dir: outputs/BGL_dev/results

split:
  method: line
  train_ratio: 0.8
  label_marker: "-"

preprocess:
  regex_profile: bgl
  mask_block_id: true
  mask_ip: true
  mask_number: true
  drop_header_fields: 3

tokenizer:
  vocab_size: 500 # ⚡ Giảm vocab size
  min_frequency: 2
  lowercase: false

train:
  max_len: 256 # ⚡ Giảm max sequence length
  mlm_probability: 0.20
  num_train_epochs: 0.02 # ⚡ CHỈ 2% epoch (~30 phút trên MPS)
  per_device_train_batch_size: 64 # ⚡ Batch lớn hơn
  learning_rate: 3.0e-4 # ⚡ LR cao hơn
  weight_decay: 0.01
  warmup_ratio: 0.05 # ⚡ Ít warmup hơn
  save_steps: 5000
  save_total_limit: 1
  logging_steps: 50
  seed: 42
  dataloader_num_workers: 0 # ⚡ MPS yêu cầu 0

inference:
  hf_model: yukyung/LAnoBERT      # ✅ Dùng pretrained model
  hf_subfolder: bgl                # ✅ BGL checkpoint
  score: error_mean
  top_k: 5
  top_ks: [1, 3, 5]
  batch_size: 64
  max_eval_samples: null           # ✅ Test trên TOÀN BỘ dataset
  pretrained_model: null
