# Test model đã train trên toàn bộ dataset
dataset: BGL
run_name: bgl_dev_full

paths:
  raw_log: data/BGL/BGL.log
  train_raw: data/BGL/BGL_train_normal.raw
  test_raw: data/BGL/BGL_test.raw
  test_label: data/BGL/BGL_test_label.log
  train_normal: data/BGL/BGL_train_normal_parsed.log
  test_log: data/BGL/BGL_test_parsed.log
  tokenizer_dir: outputs/BGL_dev/tokenizer
  model_dir: outputs/BGL_dev/model
  result_dir: outputs/BGL_dev_full/results

split:
  method: line
  train_ratio: 0.8
  label_marker: "-"

preprocess:
  regex_profile: bgl
  mask_block_id: true
  mask_ip: true
  mask_number: true
  drop_header_fields: 3

tokenizer:
  vocab_size: 500
  min_frequency: 2
  lowercase: false

train:
  max_len: 256
  mlm_probability: 0.20
  num_train_epochs: 0.02
  per_device_train_batch_size: 64
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  save_steps: 5000
  save_total_limit: 1
  logging_steps: 50
  seed: 42
  dataloader_num_workers: 0

inference:
  hf_model: null
  hf_subfolder: null
  score: error_mean
  top_k: 5
  top_ks: [1, 3, 5]
  batch_size: 64
  max_eval_samples: null       # ✅ Test TOÀN BỘ dataset
  pretrained_model: null
